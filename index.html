<body>
    <div id="root" class="text-brand-dark dark:text-gray-200"></div>
    <script>
      // Script para aplicar tema ANTES do React renderizar (evita flash)
      try {
        const saved = localStorage.getItem('theme')
        // Padrão é light mode (SEM classe dark)
        if (saved === 'dark') {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
